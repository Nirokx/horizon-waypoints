[mod]
id = "waypoints"
version = "1.1.0"
priority = 100

# Pinned: besides the native hook points it reads the window's world folder
# and the connected server's address (they name the waypoint file), the
# camera the last frame drew from, and the death screen and last death
# location, which are not part of the stable hook points.
[compatibility]
horizon_revision = "c9d474dd9116e84c243f8992d75c11314df56f06"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "waypoints_mod"
source = "runtime.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

